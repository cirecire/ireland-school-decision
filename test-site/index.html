<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>爱尔兰择校 + 安家决策</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}

    .container{background:white;border-radius:20px;padding:48px 40px;max-width:680px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,0.08);text-align:center;}
    .logo{font-size:52px;margin-bottom:16px;}
    h1{font-size:26px;font-weight:700;color:#1a5f7a;margin-bottom:10px;}
    .subtitle{color:#888;font-size:15px;line-height:1.7;margin-bottom:36px;}

    .choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px;}
    @media(max-width:580px){.choice-grid{grid-template-columns:1fr;}}

    .choice-card{
      border:2px solid #e0e8f0;border-radius:14px;padding:28px 16px;cursor:pointer;
      transition:all 0.2s;text-align:center;
    }
    .choice-card:hover{border-color:#1a5f7a;transform:translateY(-3px);box-shadow:0 6px 20px rgba(26,95,122,0.12);}
    .choice-card .icon{font-size:38px;margin-bottom:10px;}
    .choice-card .title{font-size:16px;font-weight:700;color:#1a5f7a;margin-bottom:6px;}
    .choice-card .desc{font-size:13px;color:#888;line-height:1.5;}

    .features{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px;}
    .feature-tag{background:#e8f4f8;color:#1a5f7a;padding:5px 14px;border-radius:20px;font-size:12px;}
  </style>
</head>
<body>
<div class="container">
  <div class="logo">🇮🇪</div>
  <h1>爱尔兰中学择校 + 安家</h1>
  <p class="subtitle">
    选城镇 → 看学校 → 查房价<br>
    同一界面，无需切换
  </p>

  <div class="choice-grid">
    <div class="choice-card" onclick="go('school')">
      <div class="icon">🎯</div>
      <div class="title">学校优先</div>
      <div class="desc">先确定目标学校<br>住处跟随该校所在城镇</div>
    </div>
    <div class="choice-card" onclick="go('region')">
      <div class="icon">🏠</div>
      <div class="title">居住优先</div>
      <div class="desc">先确定住在哪<br>再看该城镇有哪些学校</div>
    </div>
    <div class="choice-card" onclick="go('same')">
      <div class="icon">🔗</div>
      <div class="title">还没想好</div>
      <div class="desc">看完整选项<br>综合比较后再决定</div>
    </div>
  </div>

  <div class="features">
    <span class="feature-tag">🏛️ 56 所学校</span>
    <span class="feature-tag">🏠 城镇实时房价</span>
    <span class="feature-tag">🇮🇪 全国 26 个郡</span>
    <span class="feature-tag">🔍 实时筛选</span>
    <span class="feature-tag">🔗 学校+安家联动</span>
  </div>
</div>

<script>
function go(anchor) {
  localStorage.setItem('ireland_quiz_draft', JSON.stringify({anchor}));
  window.location.href = 'results.html';
}
</script>
</body>
</html>
