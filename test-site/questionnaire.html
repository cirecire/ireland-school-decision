<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>爱尔兰择校问卷</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; line-height: 1.6; }
    .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }

    .quiz-card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 40px; margin-bottom: 20px; }
    .quiz-header { border-bottom: 2px solid #4A90E2; padding-bottom: 20px; margin-bottom: 30px; }
    .quiz-title { font-size: 24px; font-weight: 600; color: #4A90E2; }
    .quiz-subtitle { font-size: 14px; color: #666; margin-top: 8px; }
    .progress-bar { height: 4px; background: #e0e0e0; border-radius: 2px; margin-top: 20px; }
    .progress-fill { height: 100%; background: #4A90E2; border-radius: 2px; transition: width 0.3s; }

    .question { margin-bottom: 30px; }
    .question-label { font-size: 18px; font-weight: 500; margin-bottom: 12px; display: block; }
    .question-desc { font-size: 14px; color: #666; margin-bottom: 16px; }
    .required { color: #E74C3C; margin-left: 4px; }

    select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; background: white; }
    select:focus { outline: none; border-color: #4A90E2; }

    .options { display: flex; flex-direction: column; gap: 10px; }
    .option { display: flex; align-items: flex-start; padding: 12px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
    .option:hover { border-color: #4A90E2; background: #f0f7ff; }
    .option.selected { border-color: #4A90E2; background: #e6f2ff; }
    .option input { margin-right: 10px; margin-top: 3px; }
    .option-text { flex: 1; }
    .option-title { font-weight: 500; }
    .option-note { font-size: 13px; color: #666; margin-top: 4px; }
    .option-en { font-size: 12px; color: #999; font-style: italic; margin-top: 2px; }

    .conditional { display: none; padding-left: 20px; border-left: 3px solid #4A90E2; margin-top: 20px; }
    .conditional.show { display: block; }

    .btn-group { display: flex; gap: 12px; margin-top: 30px; }
    .btn { flex: 1; padding: 14px 24px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: #4A90E2; color: white; }
    .btn-primary:hover { background: #357ABD; }
    .btn-secondary { background: #f0f0f0; color: #333; }
    .btn-secondary:hover { background: #e0e0e0; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg { color: #E74C3C; font-size: 13px; margin-top: 8px; display: none; }
    .error-msg.show { display: block; }

    /* 排序列表 */
    .sortable-list { list-style: none; padding: 0; margin: 12px 0 0; }
    .sortable-item { padding: 14px 16px; margin-bottom: 10px; background: #f8f9fa; border: 2px solid #e0e0e0; border-radius: 10px; cursor: grab; display: flex; align-items: center; gap: 12px; transition: border-color 0.2s; }
    .sortable-item:hover { border-color: #4A90E2; }
    .sortable-item.dragging { opacity: 0.5; }
    .sortable-item .rank { width: 28px; height: 28px; background: #4A90E2; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; flex-shrink: 0; }
    .sortable-item .text { flex: 1; }
    .sortable-item .text-title { font-weight: 500; }
    .sortable-item .text-note { font-size: 12px; color: #999; }
    .sortable-item .item-btns { display: flex; flex-direction: column; gap: 3px; margin-left: auto; }
    .sortable-item .move-btn { width: 28px; height: 20px; border: 1px solid #4A90E2; background: #fff; color: #4A90E2; border-radius: 4px; cursor: pointer; font-size: 11px; line-height: 1; padding: 0; }
    .sortable-item .move-btn:hover { background: #4A90E2; color: #fff; }
    .drag-handle { color: #aaa; font-size: 18px; }
    .sort-hint { font-size: 13px; color: #4A90E2; margin-bottom: 6px; }

    /* 结果页 */
    .result-card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 30px; margin-bottom: 20px; }
    .result-title { font-size: 20px; font-weight: 600; color: #4A90E2; margin-bottom: 20px; }
    .result-item { padding: 12px 0; border-bottom: 1px solid #eee; }
    .result-item:last-child { border-bottom: none; }
    .result-key { font-weight: 500; color: #666; }
    .result-value { margin-top: 4px; }

    .cache-note { background:#e8f5e9; color:#2e7d32; font-size:13px; padding:10px 14px; border-radius:6px; margin-bottom:16px; display:none; }
    .cache-note.show { display:block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="quiz-card">
      <div class="quiz-header">
        <div class="quiz-title">爱尔兰择校需求问卷</div>
        <div class="quiz-subtitle">请根据实际情况填写，我们将为您推荐最适合的学校</div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        <div id="progressLabel" style="font-size:13px;color:#666;margin-top:8px;text-align:right;">Part A · 孩子情况</div>
      </div>

      <div id="cacheNote" class="cache-note">✅ 已为您恢复上次填写的内容，可直接修改或继续</div>

      <form id="quizForm" novalidate>
        <!-- Part A: 孩子画像 -->
        <div class="part" id="partA">
          <h2 style="font-size: 20px; margin-bottom: 20px; color: #4A90E2;">Part A: 孩子画像</h2>

          <div class="question">
            <label class="question-label">孩子目前所在城市<span class="required">*</span></label>
            <select name="city" required onchange="saveDraft()">
              <option value="">请选择</option>
              <option value="beijing">北京 Beijing</option>
              <option value="shanghai">上海 Shanghai</option>
              <option value="guangzhou">广州 Guangzhou</option>
              <option value="shenzhen">深圳 Shenzhen</option>
              <option value="hangzhou">杭州 Hangzhou</option>
              <option value="chengdu">成都 Chengdu</option>
              <option value="nanjing">南京 Nanjing</option>
              <option value="wuhan">武汉 Wuhan</option>
              <option value="other">其他城市</option>
            </select>
          </div>

          <div class="question">
            <label class="question-label">孩子目前就读的学校类型<span class="required">*</span></label>
            <div class="options">
              <label class="option"><input type="radio" name="schoolType" value="public" required onchange="saveDraft()">
                <div class="option-text"><div class="option-title">公立学校</div><div class="option-note">普通公立学校，无国际课程</div></div></label>
              <label class="option"><input type="radio" name="schoolType" value="key" required onchange="saveDraft()">
                <div class="option-text"><div class="option-title">重点学校</div><div class="option-note">省/市重点学校，竞争激烈</div></div></label>
              <label class="option"><input type="radio" name="schoolType" value="international" required onchange="saveDraft()">
                <div class="option-text"><div class="option-title">国际学校</div><div class="option-note">IB/AP/A-level 等国际课程</div></div></label>
            </div>
          </div>

          <div class="question">
            <label class="question-label">孩子在年级的大概排名<span class="required">*</span></label>
            <div class="options">
              <label class="option"><input type="radio" name="rank" value="top10" required onchange="saveDraft()">
                <div class="option-text"><div class="option-title">前 10%</div><div class="option-note">优秀学生</div></div></label>
              <label class="option"><input type="radio" name="rank" value="top30" required onchange="saveDraft()">
                <div class="option-text"><div class="option-title">前 30%</div><div class="option-note">中上学生</div></div></label>
              <label class="option"><input type="radio" name="rank" value="middle" required onchange="saveDraft()">
                <div class="option-text"><div class="option-title">前 30%-70%</div><div class="option-note">中等学生</div></div></label>
              <label class="option"><input type="radio" name="rank" value="bottom" required onchange="saveDraft()">
                <div class="option-text"><div class="option-title">后 30%</div><div class="option-note">需要额外支持</div></div></label>
            </div>
          </div>

          <div class="question">
            <label class="question-label">孩子的英语水平<span class="required">*</span></label>
            <div class="question-desc">请选择标化考试成绩或自评</div>
            <select name="english" required onchange="saveDraft()">
              <option value="">请选择</option>
              <optgroup label="标化考试成绩">
                <option value="c1">雅思 6.5+ / 托福 100+ / CAE / CPE</option>
                <option value="b2">雅思 6.0 / 托福 80-99 / FCE</option>
                <option value="b1">雅思 5.5 / 托福 60-79 / PET</option>
                <option value="weak">雅思 5.0 / 托福 &lt;60 / KET</option>
              </optgroup>
              <optgroup label="自评（无标化成绩）">
                <option value="strong">流利（可全英文上课）</option>
                <option value="mid">中等（需适应期）</option>
                <option value="weakself">较弱（需语言支持）</option>
              </optgroup>
            </select>
          </div>

          <div class="question">
            <label class="question-label">孩子的性格特点（可多选）<span class="required">*</span></label>
            <div class="options">
              <label class="option"><input type="checkbox" name="personality" value="independent" onchange="saveDraft()">
                <div class="option-text"><div class="option-title">独立型</div><div class="option-note">能自己管理学习和生活</div></div></label>
              <label class="option"><input type="checkbox" name="personality" value="sensitive" onchange="saveDraft()">
                <div class="option-text"><div class="option-title">敏感型</div><div class="option-note">需要更多关注和支持</div></div></label>
              <label class="option"><input type="checkbox" name="personality" value="social" onchange="saveDraft()">
                <div class="option-text"><div class="option-title">社交型</div><div class="option-note">喜欢交朋友，适应快</div></div></label>
              <label class="option"><input type="checkbox" name="personality" value="quiet" onchange="saveDraft()">
                <div class="option-text"><div class="option-title">内向型</div><div class="option-note">需要时间适应新环境</div></div></label>
            </div>
            <div class="error-msg" id="personalityError">请至少选择一项性格特点</div>
          </div>
        </div>

        <!-- Part B: 家庭条件 -->
        <div class="part" id="partB" style="display: none;">
          <h2 style="font-size: 20px; margin-bottom: 12px; color: #4A90E2;">Part B: 决策锚点</h2>
          <p style="color:#666; font-size:14px; margin:0 0 20px; line-height:1.6;">这一步决定接下来推荐的核心逻辑：<strong style="color:#4A90E2;">先定哪个，另一个就跟哪个。</strong></p>

          <div class="question">
            <label class="question-label">您家决策的主锚是？<span class="required">*</span></label>
            <div class="question-desc">主锚决定推荐方向，另一项自动跟随</div>
            <div class="options">
              <label class="option">
                <input type="radio" name="anchor" value="school" required onchange="anchorChanged(); saveDraft();">
                <div class="option-text">
                  <div class="option-title">🎯 学校优先</div>
                  <div class="option-note">先确定目标学校 → 安家建议跟随该校所在区域</div>
                  <div class="option-en">适合：有明确目标学校，或愿意围绕学校选住处的家庭</div>
                </div>
              </label>
              <label class="option">
                <input type="radio" name="anchor" value="region" required onchange="anchorChanged(); saveDraft();">
                <div class="option-text">
                  <div class="option-title">🏠 居住优先</div>
                  <div class="option-note">先确定住在哪里 → 只推荐该区域的学校</div>
                  <div class="option-en">适合：有明确的居住区域偏好，或先解决安家问题的家庭</div>
                </div>
              </label>
              <label class="option">
                <input type="radio" name="anchor" value="same" required onchange="anchorChanged(); saveDraft();">
                <div class="option-text">
                  <div class="option-title">🔗 同一区域</div>
                  <div class="option-note">居住区域 = 学校所在区域，两者保持一致</div>
                  <div class="option-en">适合：还没特定偏好，希望看完整选项后再综合决策</div>
                </div>
              </label>
            </div>
            <div class="error-msg" id="anchorError">请选择一种决策锚点</div>
          </div>

          <!-- 锚点=学校：展示学校类型+住宿+预算，让用户心里有数 -->
          <div id="anchorSchoolHint" style="display:none;">
            <div class="question">
              <label class="question-label">目标学校类型<span class="required">*</span></label>
              <div class="options">
                <label class="option"><input type="radio" name="schoolPref" value="public" required onchange="saveDraft()">
                  <div class="option-text"><div class="option-title">公立学校</div><div class="option-note">免费，Stamp 4 可就读，需家长陪读</div></div></label>
                <label class="option"><input type="radio" name="schoolPref" value="private" required onchange="saveDraft()">
                  <div class="option-text"><div class="option-title">私立学校</div><div class="option-note">收费，可寄宿，有 EAL 支持</div></div></label>
                <label class="option"><input type="radio" name="schoolPref" value="both" required onchange="saveDraft()">
                  <div class="option-text"><div class="option-title">都可以接受</div></div></label>
              </div>
            </div>
            <div class="question">
              <label class="question-label">住宿方式<span class="required">*</span></label>
              <div class="options">
                <label class="option"><input type="radio" name="boarding" value="day" required onchange="saveDraft()"><div class="option-text"><div class="option-title">走读</div><div class="option-note">家长陪读，孩子每天回家</div></div></label>
                <label class="option"><input type="radio" name="boarding" value="boarding" required onchange="saveDraft()"><div class="option-text"><div class="option-title">寄宿</div><div class="option-note">学校宿舍（全寄宿或周寄宿）</div></div></label>
                <label class="option"><input type="radio" name="boarding" value="homestay" required onchange="saveDraft()"><div class="option-text"><div class="option-title">寄宿家庭</div><div class="option-note">学校安排当地家庭</div></div></label>
                <label class="option"><input type="radio" name="boarding" value="flex" required onchange="saveDraft()"><div class="option-text"><div class="option-title">都可以</div></div></label>
              </div>
            </div>
            <div class="question">
              <label class="question-label">学费预算（每年，欧元）</label>
              <div class="options">
                <label class="option"><input type="radio" name="budget" value="10k" required onchange="saveDraft()"><div class="option-text"><div class="option-title">≤ €10,000</div><div class="option-note">约 ¥8万/年</div></div></label>
                <label class="option"><input type="radio" name="budget" value="15k" required onchange="saveDraft()"><div class="option-text"><div class="option-title">€10,000-15,000</div></div></label>
                <label class="option"><input type="radio" name="budget" value="20k" required onchange="saveDraft()"><div class="option-text"><div class="option-title">€15,000-20,000</div></div></label>
                <label class="option"><input type="radio" name="budget" value="25k" required onchange="saveDraft()"><div class="option-text"><div class="option-title">€20,000-25,000</div></div></label>
                <label class="option"><input type="radio" name="budget" value="unlimited" required onchange="saveDraft()"><div class="option-text"><div class="option-title">≥ €25,000</div></div></label>
                <label class="option"><input type="radio" name="budget" value="undecided" required onchange="saveDraft()"><div class="option-text"><div class="option-title">还没想好</div></div></label>
              </div>
            </div>
          </div>

          <!-- 锚点=居住 或 同一区域：展示区域选择 -->
          <div id="anchorRegionHint" style="display:none;">
            <div class="question">
              <label class="question-label">希望住在哪里？<span class="required">*</span></label>
              <div class="question-desc">（可多选）学校和安家方案会限制在这些区域内</div>
              <div style="margin: 12px 0; font-weight: 500; color: #666; font-size: 13px;">🌆 都柏林 Dublin</div>
              <div class="options" style="margin-bottom: 16px; display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                <label class="option"><input type="checkbox" name="region" value="dublin4" onchange="saveDraft()"><div class="option-text"><div class="option-title">Dublin 4</div><div class="option-note">使馆区，顶级学区</div></div></label>
                <label class="option"><input type="checkbox" name="region" value="dublin6" onchange="saveDraft()"><div class="option-text"><div class="option-title">Dublin 6</div><div class="option-note">Gonzaga 所在</div></div></label>
                <label class="option"><input type="checkbox" name="region" value="dublin14" onchange="saveDraft()"><div class="option-text"><div class="option-title">Dublin 14 (Dundrum)</div><div class="option-note">最大华人社区</div></div></label>
                <label class="option"><input type="checkbox" name="region" value="blackrock" onchange="saveDraft()"><div class="option-text"><div class="option-title">Blackrock</div><div class="option-note">精英海滨区</div></div></label>
                <label class="option"><input type="checkbox" name="region" value="dunlaoghaire" onchange="saveDraft()"><div class="option-text"><div class="option-title">Dún Laoghaire</div><div class="option-note">海滨，DART 沿线</div></div></label>
                <label class="option"><input type="checkbox" name="region" value="dublin_other" onchange="saveDraft()"><div class="option-text"><div class="option-title">都柏林其他</div><div class="option-note">其他都柏林区域</div></div></label>
              </div>
              <div style="margin: 12px 0; font-weight: 500; color: #666; font-size: 13px;">🌾 都柏林周边 Dublin Surroundings</div>
              <div class="options" style="margin-bottom: 16px; display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                <label class="option"><input type="checkbox" name="region" value="kildare" onchange="saveDraft()"><div class="option-text"><div class="option-title">Kildare 郡</div><div class="option-note">Newbridge / Naas，Clongowes</div></div></label>
                <label class="option"><input type="checkbox" name="region" value="meath" onchange="saveDraft()"><div class="option-text"><div class="option-title">Meath 郡</div><div class="option-note">Navan，M3 走廊</div></div></label>
                <label class="option"><input type="checkbox" name="region" value="wicklow" onchange="saveDraft()"><div class="option-text"><div class="option-title">Wicklow 郡</div><div class="option-note">Greystones / Bray，St Gerard's</div></div></label>
              </div>
              <div style="margin: 12px 0; font-weight: 500; color: #666; font-size: 13px;">🏙️ 其他城市 Other Cities</div>
              <div class="options" style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                <label class="option"><input type="checkbox" name="region" value="cork" onchange="saveDraft()"><div class="option-text"><div class="option-title">Cork 科克</div></div></label>
                <label class="option"><input type="checkbox" name="region" value="galway" onchange="saveDraft()"><div class="option-text"><div class="option-title">Galway 高威</div></div></label>
                <label class="option"><input type="checkbox" name="region" value="limerick" onchange="saveDraft()"><div class="option-text"><div class="option-title">Limerick</div></div></label>
                <label class="option"><input type="checkbox" name="region" value="waterford" onchange="saveDraft()"><div class="option-text"><div class="option-title">Waterford</div></div></label>
              </div>
              <div class="error-msg" id="regionError">请至少选择一个区域</div>
            </div>
            <div class="question">
              <label class="question-label">目标学校类型<span class="required">*</span></label>
              <div class="options">
                <label class="option"><input type="radio" name="schoolPref" value="public" required onchange="saveDraft()"><div class="option-text"><div class="option-title">公立学校</div><div class="option-note">免费</div></div></label>
                <label class="option"><input type="radio" name="schoolPref" value="private" required onchange="saveDraft()"><div class="option-text"><div class="option-title">私立学校</div><div class="option-note">收费，可寄宿</div></div></label>
                <label class="option"><input type="radio" name="schoolPref" value="both" required onchange="saveDraft()"><div class="option-text"><div class="option-title">都可以</div></div></label>
              </div>
            </div>
            <div class="question">
              <label class="question-label">住宿方式<span class="required">*</span></label>
              <div class="options">
                <label class="option"><input type="radio" name="boarding" value="day" required onchange="saveDraft()"><div class="option-text"><div class="option-title">走读</div></div></label>
                <label class="option"><input type="radio" name="boarding" value="boarding" required onchange="saveDraft()"><div class="option-text"><div class="option-title">寄宿</div></div></label>
                <label class="option"><input type="radio" name="boarding" value="homestay" required onchange="saveDraft()"><div class="option-text"><div class="option-title">寄宿家庭</div></div></label>
                <label class="option"><input type="radio" name="boarding" value="flex" required onchange="saveDraft()"><div class="option-text"><div class="option-title">都可以</div></div></label>
              </div>
            </div>
            <div class="question">
              <label class="question-label">学费预算（每年）</label>
              <div class="options">
                <label class="option"><input type="radio" name="budget" value="10k" required onchange="saveDraft()"><div class="option-text"><div class="option-title">≤ €10,000</div></div></label>
                <label class="option"><input type="radio" name="budget" value="15k" required onchange="saveDraft()"><div class="option-text"><div class="option-title">€10-15k</div></div></label>
                <label class="option"><input type="radio" name="budget" value="20k" required onchange="saveDraft()"><div class="option-text"><div class="option-title">€15-20k</div></div></label>
                <label class="option"><input type="radio" name="budget" value="25k" required onchange="saveDraft()"><div class="option-text"><div class="option-title">€20-25k</div></div></label>
                <label class="option"><input type="radio" name="budget" value="unlimited" required onchange="saveDraft()"><div class="option-text"><div class="option-title">≥ €25k</div></div></label>
                <label class="option"><input type="radio" name="budget" value="undecided" required onchange="saveDraft()"><div class="option-text"><div class="option-title">未决定</div></div></label>
              </div>
            </div>
          </div>
        </div>

        <!-- Part C: 核心诉求 -->
        <div class="btn-group">
          <button type="button" class="btn btn-secondary" id="btnPrev" style="display: none;" onclick="prevPart()">← 上一步</button>
          <button type="button" class="btn btn-primary" id="btnNext" onclick="nextPart()">下一步 →</button>
          <button type="submit" class="btn btn-primary" id="btnSubmit" style="display: none;">查看结果 →</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentPart = 1;
    const totalParts = 2;
    const DRAFT_KEY = 'ireland_quiz_draft';
    const RESULT_KEY = 'ireland_school_quiz_result';
    const PART_IDS = 'AB';

    function updateProgress() {
      document.getElementById('progressFill').style.width = (currentPart / totalParts * 100) + '%';
      const partLabels = {1:'Part A · 孩子情况', 2:'Part B · 决策锚点（最后一步）'};
      document.getElementById('progressLabel').textContent = partLabels[currentPart] || ('Part ' + currentPart + ' / ' + totalParts);
    }

    // —— 锚点切换：控制 Part B 内条件字段的显示/隐藏 ——
    function anchorChanged() {
      const sel = document.querySelector('input[name="anchor"]:checked');
      const anchor = sel ? sel.value : null;
      const schoolHint = document.getElementById('anchorSchoolHint');
      const regionHint = document.getElementById('anchorRegionHint');
      if (schoolHint) schoolHint.style.display = (anchor === 'school') ? 'block' : 'none';
      if (regionHint) regionHint.style.display = (anchor === 'region' || anchor === 'same') ? 'block' : 'none';
      // 清除错误状态
      document.querySelectorAll('.error-msg').forEach(e => e.classList.remove('show'));
      document.querySelectorAll('.option').forEach(o => o.style.borderColor = '');
    }

    function toggleConditional(id, value) {
      const el = document.getElementById(id);
      if (value === 'private' || value === 'both') el.classList.add('show');
      else el.classList.remove('show');
    }

    function toggleHousingBudget() {
      const sel = document.querySelector('input[name="housingIntent"]:checked');
      const block = document.getElementById('housingBudgetBlock');
      if (block) {
        if (sel && sel.value !== 'rent' && sel.value !== 'undecided') block.style.display = 'block';
        else block.style.display = 'none';
      }
    }

    function collectData() {
      const form = document.getElementById('quizForm');
      const fd = new FormData(form);
      const data = {};
      fd.forEach((v, k) => {
        if (data[k]) {
          if (!Array.isArray(data[k])) data[k] = [data[k]];
          data[k].push(v);
        } else data[k] = v;
      });
      return data;
    }

    function saveDraft() {
      try {
        localStorage.setItem(DRAFT_KEY, JSON.stringify(collectData()));
      } catch (e) {}
    }

    function restoreDraft() {
      let raw;
      try { raw = localStorage.getItem(DRAFT_KEY); } catch (e) { return false; }
      if (!raw) return false;
      let data;
      try { data = JSON.parse(raw); } catch (e) { return false; }
      if (!data || Object.keys(data).length === 0) return false;

      // 填充表单
      for (const [k, v] of Object.entries(data)) {
        if (k === 'priorities') continue;
        const vals = Array.isArray(v) ? v : [v];
        vals.forEach(val => {
          const input = document.querySelector(`[name="${k}"][value="${CSS.escape(val)}"]`);
          if (input) { input.checked = true; }
        });
      }
      // 恢复锚点条件显示
      anchorChanged();
      return true;
    }

    // —— 校验 ——
    function validateCurrentPart() {
      document.querySelectorAll('.error-msg').forEach(e => e.classList.remove('show'));
      const partId = PART_IDS[currentPart - 1];
      const part = document.getElementById('part' + partId);
      let valid = true;

      const requiredInputs = part.querySelectorAll('input[required], select[required]');
      requiredInputs.forEach(input => {
        // 跳过被隐藏的必填项（如选「公立学校」后隐藏的住宿/学费）——它们不可见，不应强制
        if (input.offsetParent === null) return;
        if (input.type === 'radio' || input.type === 'checkbox') {
          const group = part.querySelectorAll(`input[name="${input.name}"]`);
          if (![...group].some(i => i.checked)) {
            valid = false;
            group.forEach(i => { const p = i.closest('.option'); if (p) p.style.borderColor = '#E74C3C'; });
          }
        } else if (!input.value) {
          valid = false;
          input.style.borderColor = '#E74C3C';
        }
      });

      if (partId === 'A') {
        const pc = document.querySelectorAll('input[name="personality"]:checked').length;
        if (pc === 0) { valid = false; document.getElementById('personalityError').classList.add('show'); }
      }
      if (partId === 'B') {
        const anchorSel = document.querySelector('input[name="anchor"]:checked');
        if (!anchorSel) { valid = false; document.getElementById('anchorError').classList.add('show'); }
        else {
          const anchor = anchorSel.value;
          if (anchor === 'region' || anchor === 'same') {
            const rc = document.querySelectorAll('input[name="region"]:checked').length;
            if (rc === 0) { valid = false; document.getElementById('regionError').classList.add('show'); }
          }
        }
      }

      if (!valid) alert('请完成所有必填项');
      return valid;
    }

    function nextPart() {
      if (!validateCurrentPart()) return;
      if (currentPart < totalParts) {
        document.getElementById('part' + PART_IDS[currentPart - 1]).style.display = 'none';
        currentPart++;
        document.getElementById('part' + PART_IDS[currentPart - 1]).style.display = 'block';
        document.getElementById('btnPrev').style.display = 'block';
        if (currentPart === totalParts) {
          document.getElementById('btnNext').style.display = 'none';
          document.getElementById('btnSubmit').style.display = 'block';
        }
        updateProgress();
        window.scrollTo(0, 0);
      }
    }

    function prevPart() {
      if (currentPart > 1) {
        document.getElementById('part' + PART_IDS[currentPart - 1]).style.display = 'none';
        currentPart--;
        document.getElementById('part' + PART_IDS[currentPart - 1]).style.display = 'block';
        document.getElementById('btnNext').style.display = 'block';
        document.getElementById('btnSubmit').style.display = 'none';
        if (currentPart === 1) document.getElementById('btnPrev').style.display = 'none';
        updateProgress();
        window.scrollTo(0, 0);
      }
    }

    // —— 提交 ——
    document.getElementById('quizForm').addEventListener('submit', function(e) {
      e.preventDefault();
      if (!validateCurrentPart()) return;
      const data = collectData();
      try {
        localStorage.setItem(RESULT_KEY, JSON.stringify(data));
        localStorage.removeItem(DRAFT_KEY); // 正式提交后清草稿，避免下次进入误恢复
      } catch (e) {}
      window.location.href = 'results.html';
    });

    // —— 初始化 ——
    if (restoreDraft()) document.getElementById('cacheNote').classList.add('show');
    updateProgress();
  </script>
</body>
</html>
