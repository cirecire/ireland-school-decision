      { id: 56, name: "St Columba's Secondary (公)",   county: "Dublin", city: "Dublin",    gender: "mixed",  type: "public",       boarding: "day",     feeDay: 0,     feeBoarding: null,   eal: "yes",      feeders: 65, lcFeeder: 65 }
    ];

    // ══════════════════════════════════════════════════════════
    // 地区 → 子区映射（用于地区硬筛）
    // ══════════════════════════════════════════════════════════
    const SCHOOL_DISTRICT = {
      1:'blackrock',2:'kildare',3:'dublin6',4:'dublin_other',5:'dublin_other',6:'dublin4',7:'dublin4',8:'dunlaoghaire',
      9:'cork',10:'cork',11:'limerick',12:'limerick',13:'limerick',14:'kildare',15:'dublin6',16:'dublin14',
      17:'dublin_other',18:'dublin6',19:'dunlaoghaire',20:'dublin14',21:'dublin4',22:'dunlaoghaire',23:'dunlaoghaire',
      24:'dunlaoghaire',25:'dublin_other',26:'dublin_other',27:'dublin14',28:'dublin14',29:'wicklow',30:'dublin6',
      31:'dublin_other',32:'dublin6',33:'dublin6',34:'dublin4',35:'dublin6',36:'dublin4',37:'dublin14',38:'dunlaoghaire',
      39:'dublin14',40:'dublin14',41:'limerick',42:'cork',43:'cork',44:'cork',45:'waterford',46:'galway',
      47:'meath',48:'meath',49:'meath',50:'meath',51:'waterford',
      52:'dublin6',53:'dunlaoghaire',54:'dublin14',55:'dublin6',56:'dublin14'
    };

    // ══════════════════════════════════════════════════════════
    // 地区 → 房价数据（CSO 官方数据 + Daft.ie 报告，均为估算）
    // districtKey 与 SCHOOL_DISTRICT 值一一对应
    // ══════════════════════════════════════════════════════════
    const HOUSING_DATA = {
      dublin4:       { label:'Dublin 4',         county:'Dublin',   median:780000, entry:550000, trend:'up',     trendPct:'5.3%/年',  types:['独栋别墅','半独立','公寓'],  daftQ:'Dublin+4',      note:'使馆区，DART Lansdowne Road 站，一线学区' },
      dublin6:       { label:'Dublin 6',          county:'Dublin',   median:620000, entry:420000, trend:'up',     trendPct:'4.1%/年',  types:['半独立','terrace','公寓'],    daftQ:'Dublin+6',      note:'Gonzaga/St Terence 所在，传统好区' },
      dublin14:      { label:'Dublin 14 (Dundrum)',county:'Dublin',  median:580000, entry:380000, trend:'up',     trendPct:'5.8%/年',  types:['独栋','半独立','terrace'],   daftQ:'Dundrum+Dublin+14', note:'最大华人社区，M50 沿线，购物便利' },
      blackrock:     { label:'Blackrock',         county:'Dublin',   median:780000, entry:520000, trend:'stable',  trendPct:'3.2%/年',  types:['海滨别墅','半独立','公寓'],   daftQ:'Blackrock+Co+Dublin', note:'精英海滨区，BART 沿线，Blackrock College 所在' },
      dunlaoghaire:  { label:'Dún Laoghaire',     county:'Dublin',   median:520000, entry:330000, trend:'up',     trendPct:'8.1%/年',  types:['terrace','半独立','公寓'],    daftQ:'Dun+Laoghaire', note:'海滨，DART 终点站，升值较快' },
      dublin_other:  { label:'都柏林其他区域',    county:'Dublin',   median:420000, entry:280000, trend:'stable',  trendPct:'3.5%/年',  types:['terrace','半独立','公寓'],    daftQ:'Dublin',          note:'包括 Castleknock/Blanchardstown/Clontarf 等' },
      kildare:       { label:'Kildare 郡',        county:'Kildare',  median:295000, entry:195000, trend:'stable',  trendPct:'2.8%/年',  types:['独栋','半独立','terrace'],    daftQ:'Newbridge+Co+Kildare', note:'Clongowes/Newbridge College 所在，性价比最高' },
      meath:         { label:'Meath 郡',          county:'Meath',    median:270000, entry:175000, trend:'stable',  trendPct:'3.0%/年',  types:['独栋','半独立','新建小区'],    daftQ:'Navan+Co+Meath', note:'M3 走廊，通勤都柏林，适合家庭' },
      wicklow:       { label:'Wicklow 郡',        county:'Wicklow',  median:340000, entry:220000, trend:'up',     trendPct:'4.5%/年',  types:['独栋别墅','半独立'],          daftQ:'Greystones+Co+Wicklow', note:'St Gerard\'s 所在，海滨小镇，通勤铁路' },
      cork:          { label:'Cork 城',           county:'Cork',    median:295000, entry:190000, trend:'stable',  trendPct:'2.5%/年',  types:['terrace','半独立','公寓'],    daftQ:'Cork+city+centre', note:'第二大城市，教育资源集中，生活成本低于都柏林' },
      limerick:      { label:'Limerick 城',       county:'Limerick', median:225000, entry:145000, trend:'stable',  trendPct:'2.2%/年',  types:['terrace','半独立','新建'],    daftQ:'Limerick+city',    note:'第三大城市，Glenstal Abbey/Rockwell College 附近' },
      galway:        { label:'Galway 城',         county:'Galway',   median:320000, entry:210000, trend:'up',     trendPct:'4.0%/年',  types:['terrace','半独立','公寓'],    daftQ:'Galway+city',     note:'西部主要城市，大学城，旅游城市' },
      waterford:     { label:'Waterford 城',      county:'Waterford',median:195000, entry:125000, trend:'stable',  trendPct:'1.8%/年',  types:['terrace','半独立'],            daftQ:'Waterford+city',  note:'东南部港口城市' },
    };

    // ══════════════════════════════════════════════════════════
    // 辅助映射
    // ══════════════════════════════════════════════════════════
    const BUDGET_MAP   = { '5k':[0,5000],'10k':[0,10000],'15k':[10000,15000],'20k':[15000,20000],'25k':[20000,25000],'unlimited':[0,50000],'undecided':[0,50000] };
    const ENGLISH_SCORE = { c1:4, b2:3, b1:2, weak:1, strong:3, mid:2, weakself:1 };
    const GENDER_MAP    = { boys:'男校', girls:'女校', mixed:'混校' };
    const BOARD_MAP     = { boarding:'全寄宿', day:'走读', both:'走读+寄宿' };
    const TYPE_MAP      = { public:'🏫 公立(免费)', private:'🏢 私立', international:'🌍 国际' };
    const ANCHOR_MAP    = { school:'🎯 学校优先', region:'🏠 居住优先', same:'🔗 同一区域' };
    const REG_MAP       = { dublin4:'Dublin 4', dublin6:'Dublin 6', dublin14:'Dundrum/D14', blackrock:'Blackrock', dunlaoghaire:'Dún Laoghaire', wicklow:'Wicklow', kildare:'Kildare', meath:'Meath', cork:'Cork', galway:'Galway', limerick:'Limerick', waterford:'Waterford', dublin_other:'都柏林其他' };
    const BOARD_TAG_MAP = { day:'走读 🏠', boarding:'寄宿 🏫', homestay:'寄宿家庭 👨‍👩‍👧', flex:'都可以 🔄' };

    // ══════════════════════════════════════════════════════════
    // 核心逻辑：加载数据、匹配评分、渲染
    // ══════════════════════════════════════════════════════════
    function loadUserData() {
      const raw = localStorage.getItem('ireland_school_quiz_result');
      if (!raw) return null;
      try { return JSON.parse(raw); } catch { return null; }
    }

    function calculateMatch(user, school) {
      let score = 0;
      const reasons = [], warnings = [];
      const schoolFee = school.feeBoarding || school.feeDay || 0;
      const engLevel  = ENGLISH_SCORE[user.english] || 2;

      const DIM = { academic:1, happiness:1, integration:1, cost:1, location:1 };
      if (Array.isArray(user.priorities) && user.priorities.length === 5) {
        [1.5, 1.25, 1.0, 0.85, 0.7].forEach((c, i) => { DIM[user.priorities[i]] = c; });
      }
      const wB = 20*(DIM.cost||1), wR = 20*(DIM.location||1), wT = 15, wBd = 15;
      const wE = 15*Math.max(DIM.happiness||1, DIM.integration||1);
      const wA = 15*(DIM.academic||1);
      const maxScore = wB + wR + wT + wBd + wE + wA;

      // 预算
      if (schoolFee === 0) { score += wB; reasons.push('🏆 公立免费'); }
      else {
        const range = BUDGET_MAP[user.budget] || [0,50000];
        if (schoolFee >= range[0] && schoolFee <= range[1]) score += wB;
        else if (user.budget === 'unlimited' || user.budget === 'undecided') score += wB*0.75;
        else { score += wB*0.25; warnings.push(`学费 €${schoolFee.toLocaleString()} 超预算`); }
      }

      // 地区（已在 pool 阶段硬筛，进入即满分）
      score += wR;

      // 类型
      if      (user.schoolPref === 'both')                          score += wT*0.8;
      else if (user.schoolPref === 'public'  && school.type==='public')  score += wT;
      else if (user.schoolPref === 'private' && (school.type==='private'||school.type==='international')) score += wT;
      else                                                        score += wT*0.33;

      // 住宿
      if      (school.type==='public')                                                    score += wBd*0.66;
      else if (user.boarding==='flex')                                                   score += wBd;
      else if (user.boarding==='boarding'  && school.boarding!=='day')                    score += wBd;
      else if (user.boarding==='day'       && (school.boarding==='day'||school.boarding==='both')) score += wBd;
      else if (user.boarding==='homestay' && school.boarding!=='day')                    score += wBd;
      else                                                                          { score += wBd*0.33; warnings.push('住宿方式不完全匹配'); }

      // EAL / 英语
      if      (school.eal==='yes')     { score += wE; reasons.push('提供 EAL 语言支持'); }
      else if (school.eal==='unknown') { score += wE*0.5; warnings.push('EAL 情况待官网核实'); }
      else if (engLevel >= 3)          score += wE*0.8;
      else                            { score += wE*0.2; warnings.push('建议提升英语后再申请'); }

      // 学术
      if      (school.feeders >= 85) score += wA;
      else if (school.feeders >= 75) score += wA*0.85;
      else if (school.feeders >= 65) score += wA*0.6;
      else                           score += wA*0.4;

      return { matchPct: Math.round((score/maxScore)*100), reasons, warnings };
    }

    function classifyTier(pct) {
      if (pct >= 75) return 'rush';
      if (pct >= 55) return 'match';
      return 'safe';
    }

    // ══════════════════════════════════════════════════════════
    // 渲染学校卡片（含房价快照）
    // ══════════════════════════════════════════════════════════
    function renderSchoolCard(school, user) {
      const { matchPct, reasons, warnings } = calculateMatch(user, school);
      const matchClass = matchPct >= 70 ? 'match-high' : matchPct >= 50 ? 'match-mid' : 'match-low';
      const district   = SCHOOL_DISTRICT[school.id] || 'dublin_other';
      const housing    = HOUSING_DATA[district];
      const genderStr  = GENDER_MAP[school.gender] || school.gender;

      // 学费文案
      let feeText;
      if (school.feeDay === 0 || school.feeBoarding === 0) feeText = '🏆 完全免费（公立）';
      else if (school.feeBoarding != null && school.feeDay != null) feeText = `💶 走读€${school.feeDay.toLocaleString()}/年 | 寄宿€${school.feeBoarding.toLocaleString()}/年`;
      else if (school.feeBoarding != null) feeText = `💶 寄宿€${school.feeBoarding.toLocaleString()}/年`;
      else feeText = `💶 走读€${school.feeDay.toLocaleString()}/年`;

      // EAL 标签
      let ealTag;
      if (school.eal === 'yes')     ealTag = '<span class="school-tag" style="background:#d4edda;color:#155724;">🆔 EAL支持</span>';
      else if (school.eal === 'no') ealTag = '<span class="school-tag" style="background:#f8d7da;color:#721c24;">⚠️ 无EAL</span>';
      else                          ealTag = '<span class="school-tag" style="background:#fff3cd;color:#856404;">❓ EAL待核</span>';

      // 房价快照 HTML（点击展开才渲染）
      let housingSnap = '';
      if (housing) {
        const trendClass = housing.trend === 'up' ? 'trend-up' : 'trend-stable';
        const typesHtml  = housing.types.map(t => `<span class="housing-type-tag">${t}</span>`).join('');
        const daftUrl    = `https://www.daft.ie/ireland/property-for-sale/?q=${encodeURIComponent(housing.daftQ)}`;
        housingSnap = `
          <div class="housing-snapshot">
            <div class="housing-snapshot-title">🏠 ${school.name} 附近房价参考</div>
            <div class="housing-snapshot-grid">
              <div class="housing-stat">
                <div class="housing-stat-val">€${Math.round(housing.median/1000)}k</div>
                <div class="housing-stat-label">中位价</div>
              </div>
              <div class="housing-stat">
                <div class="housing-stat-val">€${Math.round(housing.entry/1000)}k</div>
                <div class="housing-stat-label">入门级</div>
              </div>
              <div class="housing-stat">
                <span class="housing-trend ${trendClass}">${housing.trend==='up'?'📈':'➡️'} ${housing.trendPct}</span>
                <div class="housing-stat-label">价格趋势</div>
              </div>
            </div>
            <div class="housing-type-tags">
              <span style="font-size:12px;color:#888;margin-right:4px;">房型：</span>
              ${typesHtml}
            </div>
            <a href="${daftUrl}" target="_blank" class="housing-search-btn">🔍 在 Daft.ie 查看在售房源 →</a>
            <div class="housing-note">📌 ${housing.note}</div>
          </div>`;
      } else {
        housingSnap = `
          <div class="housing-snapshot">
            <div class="housing-snapshot-title">🏠 ${school.name} 附近房价参考</div>
            <p style="font-size:13px;color:#888;">暂无该区域详细房价数据，建议直接在 <a href="https://www.daft.ie" target="_blank" style="color:#1a5f7a;">Daft.ie</a> 搜索当地邮编了解。</p>
          </div>`;
      }

      return `
        <div class="school-card" id="card-${school.id}">
          <div class="school-header">
            <div>
              <div class="school-name">${school.name}</div>
              <div class="school-type">${TYPE_MAP[school.type] || school.type} | ${genderStr} | ${BOARD_MAP[school.boarding] || school.boarding}</div>
            </div>
            <div class="match-score ${matchClass}">${matchPct}% 匹配</div>
          </div>
          <div class="school-tags">
            <span class="school-tag">📍 ${school.city}, ${school.county}</span>
            ${ealTag}
            <span class="school-tag">${feeText}</span>
            <span class="school-tag">📊 LC升学率 ${school.lcFeeder}%</span>
          </div>
          <div class="school-meta">
            <div class="meta-item">
              <span class="meta-label">学校官网</span>
              ${school.id <= 51 ? `<a href="https://schoolsite-placeholder-${school.id}.ie" target="_blank" class="meta-value" style="color:#1a5f7a;">访问官网 →</a>` : '<span class="meta-value" style="color:#888;">公立校请联系教育局</span>'}
            </div>
            <div class="meta-item">
              <span class="meta-label">附近区域</span>
              <span class="meta-value">${housing ? housing.label : district}</span>
            </div>
          </div>
          <button class="expand-btn" type="button" onclick="toggleCard(${school.id})" id="btn-${school.id}">查看详情 + 附近房价 ▼</button>
          <div class="school-details" id="details-${school.id}">
            ${reasons.length   ? reasons.map(r => `<div class="reason-item">${r}</div>`).join('') : ''}
            ${warnings.length  ? warnings.map(w => `<div class="warning-item">${w}</div>`).join('') : ''}
            <div class="action-box">
              <div class="action-title">📋 申请行动清单</div>
              <ul class="action-list">
                <li>准备成绩单 + 班主任/校长推荐信</li>
                <li>联系学校招生办（Email / 电话）确认学位</li>
                ${school.id <= 51 ? `<li>访问官网下载申请表格</li>` : ''}
                <li>若需寄宿，提前 6 个月申请学校宿舍/寄宿家庭</li>
              </ul>
            </div>
            ${housingSnap}
          </div>
        </div>`;
    }

    function toggleCard(id) {
      const details = document.getElementById('details-' + id);
      const btn     = document.getElementById('btn-' + id);
      const open    = details.classList.toggle('show');
      btn.textContent = open ? '收起 ▲' : '查看详情 + 附近房价 ▼';
      // 滚动到卡片顶部（仅在展开时）
      if (open) {
        document.getElementById('card-' + id).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function renderTier(elementId, label, desc, schools, user) {
      const el = document.getElementById(elementId);
      if (!schools.length) { el.style.display = 'none'; return; }
      el.innerHTML = `
        <div class="tier-header">
          <span class="tier-badge">${label}</span>
          <span class="tier-name">${schools.length} 所学校</span>
          <span class="tier-desc">${desc}</span>
        </div>
        ${schools.map(s => renderSchoolCard(s, user)).join('')}`;
    }

    function renderResults(user) {
      // 用户条件摘要
      const tags = [];
      const CITY_MAP = { shenzhen:'深圳',beijing:'北京',shanghai:'上海',guangzhou:'广州',hangzhou:'杭州',chengdu:'成都',nanjing:'南京',wuhan:'武汉' };
      const BUD_MAP  = { '5k':'💶 ≤€5k','10k':'💶 ≤€10k','15k':'💶 €10-15k','20k':'💶 €15-20k','25k':'💶 €20-25k','unlimited':'💰 灵活','undecided':'💰 待定' };
      const ENG_MAP  = { c1:'🎓 雅思6.5+',b2:'🎓 雅思6.0',b1:'🎓 雅思5.5',weak:'📚 ≤雅思5',strong:'🎓 流利',mid:'🎓 中等',weakself:'📚 较弱' };
      if (user.city)    tags.push('📍 ' + (CITY_MAP[user.city]||user.city));
      if (user.schoolPref) tags.push(TYPE_MAP[user.schoolPref]||user.schoolPref);
      if (user.budget)  tags.push(BUD_MAP[user.budget]||user.budget);
      if (user.english) tags.push(ENG_MAP[user.english]||user.english);
      if (user.anchor)  tags.push(ANCHOR_MAP[user.anchor]||user.anchor);
      if (user.boarding)tags.push(BOARD_TAG_MAP[user.boarding]||user.boarding);
      if (Array.isArray(user.region) && user.region.length) {
        tags.push('📌 区域：' + user.region.map(r => REG_MAP[r]||r).join('、'));
      }
      document.getElementById('summaryTags').innerHTML = tags.map(t => `<span class="tag">${t}</span>`).join('');

      // 地区硬筛
      const userRegions = Array.isArray(user.region) ? user.region : (user.region ? [user.region] : []);
      let pool = SCHOOLS;
      if (userRegions.length) {
        pool = SCHOOLS.filter(s => userRegions.includes(SCHOOL_DISTRICT[s.id]));
      }

      const scored = pool.map(s => {
        const { matchPct, reasons, warnings } = calculateMatch(user, s);
        return { ...s, matchPct, reasons, warnings, tier: classifyTier(matchPct) };
      }).filter(s => s.matchPct >= 30).sort((a,b) => b.matchPct - a.matchPct);

      document.getElementById('loading').style.display = 'none';
      if (!scored.length) { document.getElementById('emptyState').style.display = 'block'; return; }
      document.getElementById('results').style.display = 'block';

      const rush  = scored.filter(s=>s.tier==='rush').slice(0,3);
      const match = scored.filter(s=>s.tier==='match').slice(0,4);
      const safe  = scored.filter(s=>s.tier==='safe').slice(0,4);
      renderTier('rushSection',  '冲刺', '条件匹配度高，值得重点申请', rush,  user);
      renderTier('matchSection', '匹配', '当前条件较符合，推荐重点关注', match, user);
      renderTier('safeSection',  '保底', '最稳妥的选择，建议作为保底', safe,  user);
    }

    // ══════════════════════════════════════════════════════════
    // 初始化
    // ══════════════════════════════════════════════════════════
    document.addEventListener('DOMContentLoaded', function() {
      const user = loadUserData();
      if (!user) {
        document.getElementById('loading').innerHTML = `
          <div style="padding:40px;text-align:center;">
            <h3>暂无问卷数据</h3>
            <p style="margin:15px 0;color:#999;">请先填写择校问卷</p>
            <a href="questionnaire.html" class="btn-primary">去填问卷</a>
          </div>`;
        return;
      }
      // 字段归一化
      if (!Array.isArray(user.region)) user.region = user.region ? [user.region] : [];
      if (!user.boarding)              user.boarding = 'flex';
      if (!user.budget)                user.budget = 'undecided';
      if (!user.schoolType)            user.schoolType = user.schoolPref || 'both';
      if (!user.anchor)               user.anchor = (user.region&&user.region.length) ? 'same' : 'school';

      try { renderResults(user); }
      catch (err) {
        document.getElementById('loading').style.display = 'none';
        const eb = document.getElementById('errorState');
        if (eb) { eb.style.display='block'; document.getElementById('errorMessage').textContent = String(err&&err.stack||err); }
        console.error(err);
      }
    });
  </script>
</body>
