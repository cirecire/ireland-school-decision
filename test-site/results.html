<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>爱尔兰择校 + 安家决策</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; color: #333; line-height: 1.6; }

    /* ── 顶部 ── */
    .topbar { background: white; border-bottom: 1px solid #e0e0e0; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .topbar-brand { font-size: 18px; font-weight: 700; color: #1a5f7a; }
    .topbar-brand span { font-size: 20px; }
    .topbar-info { font-size: 13px; color: #888; }

    .hero { background: linear-gradient(135deg, #1a5f7a 0%, #2d8f6f 100%); color: white; padding: 40px 20px 30px; text-align: center; }
    .hero h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    .hero p  { font-size: 15px; opacity: 0.9; }

    /* ── 主容器 ── */
    .main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }

    /* ── 锚点 ── */
    .anchor-section { margin-bottom: 28px; }
    .anchor-cards { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
    @media(max-width:580px){.anchor-cards{grid-template-columns:1fr;}}

    .anchor-card {
      background: white; border-radius: 12px; padding: 20px;
      text-align: center; cursor: pointer; border: 2px solid transparent;
      transition: all 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }
    .anchor-card:hover{border-color:#1a5f7a;transform:translateY(-2px);}
    .anchor-card.selected{border-color:#1a5f7a;background:#f0f7ff;}
    .anchor-card .icon{font-size:30px;margin-bottom:8px;}
    .anchor-card .title{font-size:15px;font-weight:700;color:#1a5f7a;margin-bottom:4px;}
    .anchor-card .desc{font-size:12px;color:#888;}

    /* ── 筛选栏 ── */
    .filter-bar {
      background: white; border-radius: 12px; padding: 16px 20px;
      margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: none;
    }
    .filter-bar.show{display:block;}
    .filter-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;}
    .filter-row:last-child{margin-bottom:0;}
    .filter-label{font-size:13px;color:#666;font-weight:500;min-width:52px;}
    .filter-chips{display:flex;flex-wrap:wrap;gap:6px;}
    .chip{
      padding:5px 12px;border:1.5px solid #ddd;border-radius:20px;
      cursor:pointer;font-size:12px;background:white;color:#555;transition:all 0.15s;
    }
    .chip:hover{border-color:#1a5f7a;color:#1a5f7a;}
    .chip.active{background:#1a5f7a;border-color:#1a5f7a;color:white;}
    .filter-count{font-size:12px;color:#888;margin-left:auto;}
    .filter-count strong{color:#1a5f7a;}
    .search-box{position:relative;}
    .search-box input{
      width:100%;max-width:240px;padding:7px 10px 7px 32px;
      border:1.5px solid #ddd;border-radius:8px;font-size:13px;outline:none;
    }
    .search-box input:focus{border-color:#1a5f7a;}
    .search-box::before{content:'🔍';position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:13px;}

    /* ── 步骤提示 ── */
    .step-hint{text-align:center;padding:50px 20px;background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
    .step-hint .icon{font-size:40px;margin-bottom:12px;}
    .step-hint h3{font-size:18px;color:#1a5f7a;margin-bottom:8px;}
    .step-hint p{color:#888;font-size:14px;line-height:1.7;}

    /* ── 城镇列表 ── */
    .county-group{margin-bottom:32px;}
    .county-header{
      display:flex;align-items:center;gap:10px;margin-bottom:14px;
      padding-bottom:8px;border-bottom:2px solid #1a5f7a;
    }
    .county-name{font-size:20px;font-weight:700;color:#1a5f7a;}
    .county-count{font-size:12px;color:#888;background:#e8f4f8;padding:2px 10px;border-radius:12px;}
    .town-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}

    /* ── 城镇卡片 ── */
    .town-card{
      background:white;border-radius:14px;padding:18px;
      box-shadow:0 2px 8px rgba(0,0,0,0.06);
      border-left:4px solid #ddd;transition:all 0.2s;
    }
    .town-card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.1);}
    .town-card.active{border-left-color:#1a5f7a;}
    .town-name{font-size:17px;font-weight:700;color:#222;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
    .town-meta{font-size:12px;color:#888;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;}

    /* ── 房价条 ── */
    .housing-strip{
      background:#f0f7ff;border-radius:8px;padding:10px 14px;
      display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;
      font-size:12px;margin-bottom:12px;
    }
    .housing-stat{text-align:center;}
    .housing-stat .num{font-size:17px;font-weight:700;color:#1a5f7a;}
    .housing-stat .lbl{color:#888;font-size:10px;margin-top:1px;}
    .housing-stat .trend{
      display:inline-block;padding:1px 5px;border-radius:4px;
      font-size:10px;font-weight:500;margin-top:2px;
    }
    .trend-up{background:#d4edda;color:#155724;}
    .trend-stable{background:#fff3cd;color:#856404;}

    /* ── 学校列表 ── */
    .school-mini-list{display:flex;flex-direction:column;gap:8px;}
    .school-mini{
      background:#fafafa;border-radius:8px;padding:10px 12px;
      border:1px solid #eee;cursor:pointer;transition:all 0.15s;
    }
    .school-mini:hover{border-color:#1a5f7a;background:#f0f7ff;}
    .school-mini-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
    .school-mini-name{font-size:14px;font-weight:600;color:#222;}
    .school-mini-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
    .school-mini-tag{background:#eee;color:#555;padding:2px 7px;border-radius:10px;font-size:11px;}
    .school-mini-tag.fee-green{background:#d4edda;color:#155724;}
    .school-mini-tag.fee-yellow{background:#fff3cd;color:#856404;}
    .school-mini-tag.fee-red{background:#fde8e6;color:#c0392b;}
    .school-mini-tag.fee-gray{background:#eef0f2;color:#7a7a7a;}
    .school-mini-tag.eal-yes{background:#d4edda;color:#155724;}
    .school-mini-tag.eal-no{background:#f8d7da;color:#721c24;}

    /* ── 学校详情弹窗 ── */
    .school-modal{
      display:none;position:fixed;inset:0;z-index:200;
      background:rgba(0,0,0,0.5);align-items:center;justify-content:center;
      padding:20px;
    }
    .school-modal.open{display:flex;}
    .school-modal-box{
      background:white;border-radius:16px;max-width:600px;width:100%;
      max-height:90vh;overflow-y:auto;padding:28px;
      position:relative;
    }
    .modal-close{
      position:absolute;top:16px;right:16px;background:none;border:none;
      font-size:24px;cursor:pointer;color:#888;
    }
    .modal-close:hover{color:#333;}
    .modal-name{font-size:22px;font-weight:700;color:#222;margin-bottom:8px;}
    .modal-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
    .modal-tag{background:#eee;color:#555;padding:4px 10px;border-radius:12px;font-size:12px;}
    .modal-section{margin-bottom:16px;}
    .modal-section-title{font-size:14px;font-weight:600;color:#1a5f7a;margin-bottom:8px;}
    .modal-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .modal-meta-item{background:#f5f5f5;padding:10px 12px;border-radius:8px;}
    .modal-meta-item .label{font-size:11px;color:#888;margin-bottom:2px;}
    .modal-meta-item .value{font-size:14px;font-weight:600;color:#333;}
    .modal-housing{background:#f0f7ff;border:1px solid #b3d7ff;border-radius:10px;padding:14px;margin-top:12px;}
    .modal-housing-title{font-size:14px;font-weight:600;color:#1a5f7a;margin-bottom:10px;}
    .modal-housing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;}
    .modal-housing-stat .num{font-size:20px;font-weight:700;color:#1a5f7a;}
    .modal-housing-stat .lbl{font-size:11px;color:#888;margin-top:2px;}
    .modal-da .housing-trend{display:inline-block;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:500;margin-top:2px;}
    .modal-action{background:#f8f9fa;border-radius:8px;padding:14px;margin-top:12px;}
    .modal-action-title{font-size:13px;font-weight:600;margin-bottom:8px;}
    .modal-action-list{list-style:none;}
    .modal-action-list li{padding:4px 0;font-size:13px;color:#555;display:flex;align-items:center;gap:6px;}
    .modal-action-list li::before{content:'☐';color:#1a5f7a;}

    /* ── 空状态 ── */
    .empty-state{text-align:center;padding:50px 20px;color:#888;background:white;border-radius:12px;}
    .empty-state .icon{font-size:40px;margin-bottom:12px;}
    .empty-state h3{color:#555;margin-bottom:8px;}
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand"><span>🇮🇪</span> 爱尔兰择校 + 安家</div>
  <div class="topbar-info">全国城镇学校 · 实时房价</div>
</div>

<div class="hero">
  <h1>选城镇，看学校，查房价</h1>
  <p>County → Town → 学校 · 同一界面展示学校信息与区域房价</p>
</div>

<div class="main">

  <!-- 锚点 -->
  <div class="anchor-section">
    <div class="anchor-cards">
      <div class="anchor-card" id="ac-school" onclick="selectAnchor('school')">
        <div class="icon">🎯</div><div class="title">学校优先</div><div class="desc">先定学校<br>住处跟随该校所在城镇</div>
      </div>
      <div class="anchor-card" id="ac-region" onclick="selectAnchor('region')">
        <div class="icon">🏠</div><div class="title">居住优先</div><div class="desc">先定住在哪<br>只看该城镇的学校</div>
      </div>
      <div class="anchor-card" id="ac-same" onclick="selectAnchor('same')">
        <div class="icon">🔗</div><div class="title">还没想好</div><div class="desc">看完整选项<br>综合决策</div>
      </div>
    </div>
  </div>

  <!-- 筛选栏 -->
  <div id="filterBar" class="filter-bar">
    <div class="filter-row">
      <div class="filter-label">搜索</div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="输入学校名称或城镇..." oninput="renderAll()">
      </div>
      <div class="filter-label" style="margin-left:12px;">类型</div>
      <div class="filter-chips" id="chips-type">
        <span class="chip active" onclick="toggleChip(this,'type','all')">全部</span>
        <span class="chip" onclick="toggleChip(this,'type','private')">私立</span>
        <span class="chip" onclick="toggleChip(this,'type','public')">公立</span>
      </div>
      <div class="filter-label" style="margin-left:4px;">性别</div>
      <div class="filter-chips" id="chips-gender">
        <span class="chip active" onclick="toggleChip(this,'gender','all')">全部</span>
        <span class="chip" onclick="toggleChip(this,'gender','boys')">男校</span>
        <span class="chip" onclick="toggleChip(this,'gender','girls')">女校</span>
        <span class="chip" onclick="toggleChip(this,'gender','mixed')">混校</span>
      </div>
    </div>
    <div class="filter-row">
      <div class="filter-label">住宿</div>
      <div class="filter-chips" id="chips-board">
        <span class="chip active" onclick="toggleChip(this,'board','all')">全部</span>
        <span class="chip" onclick="toggleChip(this,'board','day')">走读</span>
        <span class="chip" onclick="toggleChip(this,'board','boarding')">寄宿</span>
        <span class="chip" onclick="toggleChip(this,'board','both')">两者</span>
      </div>
      <div class="filter-label" style="margin-left:4px;">预算</div>
      <div class="filter-chips" id="chips-budget">
        <span class="chip active" onclick="toggleChip(this,'budget','all')">不限</span>
        <span class="chip" onclick="toggleChip(this,'budget','free')">免费</span>
        <span class="chip" onclick="toggleChip(this,'budget','low')">≤€10k</span>
        <span class="chip" onclick="toggleChip(this,'budget','mid')">€10-20k</span>
        <span class="chip" onclick="toggleChip(this,'budget','high')">€20k+</span>
      </div>
      <div class="filter-count" id="filterCount">显示 <strong>0</strong> 所学校</div>
    </div>
  </div>

  <!-- 内容区 -->
  <div id="contentArea">
    <div id="stepHint" class="step-hint">
      <div class="icon">👆</div>
      <h3>请先选择决策主锚</h3>
      <p>选「学校优先」「居住优先」或「还没想好」<br>然后开始浏览城镇与学校</p>
    </div>
    <div id="townsContainer" style="display:none;"></div>
    <div id="emptyState" class="empty-state" style="display:none;">
      <div class="icon">🔍</div>
      <h3>没有找到符合条件的学校</h3>
      <p>试试调整筛选条件</p>
    </div>
  </div>
</div>

<!-- 学校详情弹窗 -->
<div id="schoolModal" class="school-modal" onclick="if(event.target===this)closeModal()">
  <div class="school-modal-box">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div id="modalContent"></div>
  </div>
</div>

function selectAnchor(anchor) {
  currentAnchor = anchor;

  renderAll();
}

// ══════════════════════════════════════════════════════
// 筛选芯片
// ══════════════════════════════════════════════════════
function toggleChip(el, kind, val) {
  el.closest('.filter-chips').querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  filters[kind] = val;
  renderAll();
}

// ══════════════════════════════════════════════════════
// 核心渲染
// ══════════════════════════════════════════════════════
function renderAll() {
  searchQ = (document.getElementById('searchInput')||{}).value||'';
  searchQ = searchQ.trim().toLowerCase();

  // 按郡分组
  const countyMap = {};
  let totalCount = 0;

  SCHOOLS.forEach(s => {
    const filtered = applyFilters([s]);
    if (!filtered.length) return;
    totalCount++;

    if (!countyMap[s.county]) countyMap[s.county] = {};
    if (!countyMap[s.county][s.town]) countyMap[s.county][s.town] = []
    countyMap[s.county][s.town].push(s);
  });

  document.getElementById('filterCount').innerHTML =
    `显示 <strong>${totalCount}</strong> 所学校`;

  const container = document.getElementById('townsContainer');
  const empty = document.getElementById('emptyState');

  if (totalCount === 0) {
    container.style.display = 'none';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';
  container.style.display = 'block';

  // 生成郡列表（优先 Dublin → Kildare → 其他）
  const countyOrder = ['Dublin','Kildare','Wicklow','Meath','Louth','Cork','Limerick','Galway','Wexford',
    'Longford','Westmeath','Offaly','Laois','Carlow','Kerry','Tipperary','Waterford','Clare',
    'Mayo','Roscommon','Sligo','Leitrim','Donegal','Cavan','Monaghan','Kilkenny'];
  const sortedCounties = Object.keys(countyMap).sort((a,b)=>{
    const ai=countyOrder.indexOf(a),bi=countyOrder.indexOf(b);
    return (ai===-1?99:ai)-(bi===-1?99:bi);
  });

  container.innerHTML = sortedCounties.map(county => {
    const towns = countyMap[county];
    const countyLabel = COUNTY_NAMES[county] || county;
    const countySchoolCount = Object.values(towns).reduce((a,b)=>a+b.length,0);
    const townEntries = Object.entries(towns).sort((a,b)=>b[1].length-a[1].length);

    return `
      <div class="county-group">
        <div class="county-header">
          <span class="county-name">🏛️ ${countyLabel}</span>
          <span class="county-count">${countySchoolCount} 所学校</span>
        </div>
        <div class="town-grid">
          ${townEntries.map(([town, schools]) => (schools.sort((a,b)=>{const pa=a.progression!=null?a.progression:-1;const pb=b.progression!=null?b.progression:-1;return pb-pa;}), renderTownCard(town, county, schools))).join('')}
        </div>
      </div>`;
  }).join('');
}

function renderTownCard(town, county, schools) {
  // 房价：取该镇第一所学校的 district
  const firstDistrict = (schools[0].district && HOUSING_DATA[schools[0].district]) ? schools[0].district : 'dublin_other';
  const housing = HOUSING_DATA[firstDistrict];
  const trendClass = housing&&housing.trend==='up'?'trend-up':'trend-stable';

  return `
    <div class="town-card">
      <div class="town-name">📍 ${town}</div>
      <div class="town-meta">
        ${schools.length} 所学校
        ${housing ? `<span>· 房价 €${Math.round(housing.median/1000)}k</span>` : ''}
        ${housing ? `<span>· ${housing.trendPct}</span>` : ''}
      </div>
      ${housing ? `
      <div class="housing-strip">
        <div class="housing-stat">
          <div class="num">€${Math.round(housing.median/1000)}k</div>
          <div class="lbl">中位价</div>
          <span class="trend ${trendClass}">${housing.trendPct}</span>
        </div>
        <div class="housing-stat">
          <div class="num">€${Math.round(housing.entry/1000)}k</div>
          <div class="lbl">入门房价</div>
        </div>
        <div class="housing-stat">
          <div class="num">${housing.label.split('/')[0]}</div>
          <div class="lbl">所在区域</div>
        </div>
      </div>` : ''}
      <div class="school-mini-list">
        ${schools.map(s => renderSchoolMini(s)).join('')}
      </div>
    </div>`;
}

function renderSchoolMini(s) {
  const displayFee = s.feeBoarding || s.feeDay;
  let feeLabel, feeClass;
  if (displayFee===0||displayFee==null) { feeLabel='免费'; feeClass='fee-green'; }
  else if (displayFee<=6000) { feeLabel='€'+displayFee.toLocaleString()+'/年'; feeClass='fee-green'; }
  else if (displayFee<=12000) { feeLabel='€'+displayFee.toLocaleString()+'/年'; feeClass='fee-yellow'; }
  else { feeLabel='€'+displayFee.toLocaleString()+'/年'; feeClass='fee-red'; }

  const genderText = {boys:'男校',girls:'女校',mixed:'混校'}[s.gender]||s.gender;
  const typeText = {public:'🏫 公立',private:'🏢 私立',international:'🌍 国际'}[s.type]||s.type;
  const ealClass = s.eal==='yes'?'eal-yes':s.eal==='no'?'eal-no':'';
  const ealText = s.eal==='yes'?'EAL支持':s.eal==='no'?'无EAL':'EAL待核';
  const prog = s.progression;
  let progLabel, progClass;
  if (prog==null) { progLabel='升学率待更新'; progClass='fee-gray'; }
  else if (prog>=85) { progLabel='升学率 '+prog+'%'; progClass='fee-green'; }
  else if (prog>=65) { progLabel='升学率 '+prog+'%'; progClass='fee-yellow'; }
  else { progLabel='升学率 '+prog+'%'; progClass='fee-red'; }
  const boardText = {boarding:'寄宿',day:'走读',both:'走读+寄宿'}[s.boarding]||s.boarding;

  return `
    <div class="school-mini" onclick="openModal(${s.id})">
      <div class="school-mini-header">
        <div>
          <div class="school-mini-name">${s.name}</div>
          <div class="school-mini-tags">
            <span class="school-mini-tag">${typeText}</span>
            <span class="school-mini-tag">${genderText}</span>
            <span class="school-mini-tag">${boardText}</span>
            <span class="school-mini-tag ${feeClass}">${feeLabel}</span>
            <span class="school-mini-tag ${ealClass}">${ealText}</span>
            <span class="school-mini-tag ${progClass}">${progLabel}${progWarn}</span>
          </div>
        </div>
        <span style="font-size:16px;color:#1a5f7a;flex-shrink:0;">→</span>
      </div>
    </div>`;
}

// ══════════════════════════════════════════════════════
// 筛选逻辑
// ══════════════════════════════════════════════════════
function applyFilters(schoolList) {
  let list = schoolList;
  if (searchQ) {
    list = list.filter(s =>
      s.name.toLowerCase().includes(searchQ) ||
      s.town.toLowerCase().includes(searchQ) ||
      s.county.toLowerCase().includes(searchQ)
    );
  }
  if (filters.type !== 'all') {
    list = list.filter(s => {
      if (filters.type==='private') return s.type==='private'||s.type==='international';
      return s.type === filters.type;
    });
  }
  if (filters.gender !== 'all') list = list.filter(s => s.gender === filters.gender);
  if (filters.board !== 'all') {
    list = list.filter(s => {
      if (filters.board==='day') return s.boarding==='day'||s.boarding==='both';
      if (filters.board==='boarding') return s.boarding==='boarding'||s.boarding==='both';
      return s.boarding==='both';
    });
  }
  if (filters.budget !== 'all') {
    list = list.filter(s => {
      const fee = s.feeBoarding||s.feeDay||0;
      if (filters.budget==='free')  return fee===0;
      if (filters.budget==='low')  return fee>0&&fee<=10000;
      if (filters.budget==='mid')  return fee>10000&&fee<=20000;
      if (filters.budget==='high') return fee>20000;
      return true;
    });
  }
  return list;
}

// ══════════════════════════════════════════════════════
// 学校详情弹窗
// ══════════════════════════════════════════════════════
function openModal(id) {
  const s = SCHOOLS.find(x=>x.id===id);
  if (!s) return;
  const housing = HOUSING_DATA[s.district]||{};
  const trendClass = housing.trend==='up'?'trend-up':'trend-stable';
  const displayFee = s.feeBoarding||s.feeDay;
  const feeText = !displayFee&&displayFee!==0 ? '待询'
    : displayFee===0 ? '🏆 完全免费（公立）'
    : `💶 €${displayFee.toLocaleString()}/年`;

  const genderText={boys:'男校',girls:'女校',mixed:'混校'}[s.gender]||s.gender;
  const typeText={public:'🏫 公立(免费)',private:'🏢 私立',international:'🌍 国际'}[s.type]||s.type;
  const boardText={boarding:'全寄宿',day:'走读',both:'走读+寄宿'}[s.boarding]||s.boarding;
  const ealText=s.eal==='yes'?'✅ 提供 EAL 语言支持':s.eal==='no'?'⚠️ 无 EAL 支持':'❓ EAL 情况待官网核实';
  const daftUrl = housing.label
    ? `https://www.daft.ie/ireland/property-for-sale/?q=${encodeURIComponent(housing.label)}`
    : 'https://www.daft.ie';

  document.getElementById('modalContent').innerHTML = `
    <div class="modal-name">${s.name}</div>
    <div class="modal-tags">
      <span class="modal-tag">${typeText}</span>
      <span class="modal-tag">${genderText}</span>
      <span class="modal-tag">${boardText}</span>
      <span class="modal-tag">${feeText}</span>
    </div>
    <div class="modal-section">
      <div class="modal-section-title">📊 关键指标</div>
      <div class="modal-meta">
        <div class="modal-meta-item"><div class="label">大学升学率</div><div class="value">${s.progression==null?'待更新':s.progression+'%'}</div></div>
        <div class="modal-meta-item"><div class="label">LC 应考人数</div><div class="value">${s.lcSits==null?'—':s.lcSits+' 人'}</div></div>
        <div class="modal-meta-item"><div class="label">所在城镇</div><div class="value">${s.town}, ${s.county}</div></div>
        <div class="modal-meta-item"><div class="label">英语支持</div><div class="value">${ealText}</div></div>
      </div>
      <div style="font-size:11px;color:#999;margin-top:8px;line-height:1.5;">数据来源：Irish Times 2025 Feeder Schools（基于 SEC + 各高校大一新生来源）。该比例为含往届/复读生的复合值，真实应届升学率约低 20%。</div>
    </div>
    ${housing.median ? `
    <div class="modal-housing">
      <div class="modal-housing-title">🏠 ${s.town} 周边房价参考</div>
      <div class="modal-housing-grid">
        <div class="modal-housing-stat">
          <div class="num">€${Math.round(housing.median/1000)}k</div>
          <div class="lbl">区域中位价</div>
          <span class="housing-trend ${trendClass}">${housing.trendPct}</span>
        </div>
        <div class="modal-housing-stat">
          <div class="num">€${Math.round(housing.entry/1000)}k</div>
          <div class="lbl">入门级房价</div>
        </div>
        <div class="modal-housing-stat">
          <div class="num">${housing.label.split('/')[0]}</div>
          <div class="lbl">参考区域</div>
        </div>
      </div>
      <a href="${daftUrl}" target="_blank" style="display:inline-block;margin-top:12px;background:#1a5f7a;color:white;padding:8px 16px;border-radius:6px;text-decoration:none;font-size:13px;">🔍 在 Daft.ie 查看实时房源 →</a>
    </div>` : ''}
    <div class="modal-action">
      <div class="modal-action-title">📋 申请行动清单</div>
      <ul class="modal-action-list">
        <li>准备成绩单 + 班主任/校长推荐信</li>
        <li>联系学校招生办（Email / 电话）确认学位</li>
        <li>若需寄宿，提前 6 个月申请学校宿舍/寄宿家庭</li>
        <li>Stamp 4 签证持有者可享欧盟生学费待遇（大学阶段）</li>
      </ul>
    </div>`;

  document.getElementById('schoolModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('schoolModal').classList.remove('open');
  document.body.style.overflow = '';
}

// 初始化
(function init() {
  try {
    const draft = JSON.parse(localStorage.getItem('ireland_quiz_draft')||'{}');
    if (draft.anchor) { selectAnchor(draft.anchor); localStorage.removeItem('ireland_quiz_draft'); }
  } catch(e){}
})();
</script>
