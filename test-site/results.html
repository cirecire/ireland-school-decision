    const BUDGET_MAP = { '10k': [0, 10000], '15k': [10000, 15000], '20k': [15000, 20000], '25k': [20000, 25000], 'unlimited': [0, 50000], 'undecided': [0, 50000] };
    const ENGLISH_SCORE = { c1: 4, b2: 3, b1: 2, weak: 1, strong: 3, mid: 2, weakself: 1 };
    // 每所学校的地区标签（与问卷 region 选项值一一对应），用于地区硬筛
    // dublin_other = 未单独列出的都柏林校（Belvedere / Castleknock / Sutton Park / Mount Sackville / King's Hospital / Loreto Foxrock 等）
    const SCHOOL_DISTRICT = {
      1:'blackrock',2:'kildare',3:'dublin6',4:'dublin_other',5:'dublin_other',6:'dublin4',7:'dublin4',8:'dunlaoghaire',9:'cork',10:'cork',
      11:'limerick',12:'limerick',13:'limerick',14:'kildare',15:'dublin6',16:'dublin14',17:'dublin_other',18:'dublin6',19:'dunlaoghaire',20:'dublin14',
      21:'dublin4',22:'dunlaoghaire',23:'dunlaoghaire',24:'dunlaoghaire',25:'dublin_other',26:'dublin_other',27:'dublin14',28:'dublin14',29:'wicklow',30:'dublin6',
      31:'dublin_other',32:'dublin6',33:'dublin6',34:'dublin4',35:'dublin6',36:'dublin4',37:'dublin14',38:'dunlaoghaire',39:'dublin14',40:'dublin14',
      41:'limerick',42:'cork',43:'cork',44:'cork',45:'waterford',46:'galway',47:'meath',48:'meath',49:'meath',50:'meath',
      51:'waterford',52:'dublin6',53:'dunlaoghaire',54:'dublin14',55:'dublin6',56:'dublin14'
    };

    function loadUserData() {
      const data = localStorage.getItem('ireland_school_quiz_result');
      if (!data) return null;
      try { return JSON.parse(data); } catch { return null; }
    }

    function calculateMatch(user, school) {
      let score = 0;
      const reasons = [];
      const warnings = [];
      const schoolFee = school.feeBoarding || school.feeDay || 0;
      const engLevel = ENGLISH_SCORE[user.english] || 2;

      // 优先级权重（排序越靠前系数越高）
      const DIM = { academic: 1, happiness: 1, integration: 1, cost: 1, location: 1 };
      if (Array.isArray(user.priorities) && user.priorities.length === 5) {
        const coef = [1.5, 1.25, 1.0, 0.85, 0.7];
        user.priorities.forEach((p, i) => { DIM[p] = coef[i]; });
      }
      const wBudget = 20 * (DIM.cost || 1);
      const wRegion = 20 * (DIM.location || 1);
      const wType = 15;
      const wBoard = 15;
      const wEal = 15 * Math.max(DIM.happiness || 1, DIM.integration || 1);
      const wAcademic = 15 * (DIM.academic || 1);
      const maxScore = wBudget + wRegion + wType + wBoard + wEal + wAcademic;

      // 1. 预算（地区硬筛后，区域内学校都给区域满分；此处算预算）
      if (schoolFee === 0) { score += wBudget; reasons.push('🏆 公立学校完全免费'); }
      else {
        const budgetRange = BUDGET_MAP[user.budget] || [0, 50000];
        if (schoolFee >= budgetRange[0] && schoolFee <= budgetRange[1]) score += wBudget;
        else if (user.budget === 'unlimited' || user.budget === 'undecided') score += wBudget * 0.75;
        else { score += wBudget * 0.25; warnings.push(`学费 €${schoolFee.toLocaleString()} 超出预算`); }
      }

      // 2. 地区（已在 renderResults 硬筛，进入 pool 的学校都在区域内，给满分）
      score += wRegion;

      // 3. 学校类型
      if (user.schoolPref === 'both') score += wType * 0.8;
      else if (user.schoolPref === 'public' && school.type === 'public') { score += wType; reasons.push('符合公立学校偏好（免费）'); }
      else if (user.schoolPref === 'private' && (school.type === 'private' || school.type === 'international')) score += wType;
      else score += wType * 0.33;

      // 4. 住宿
      if (school.type === 'public') score += wBoard * 0.66;
      else if (user.boarding === 'flex' || user.boarding === 'both') score += wBoard;
      else if (user.boarding === 'boarding' && school.boarding !== 'day') score += wBoard;
      else if (user.boarding === 'day' && (school.boarding === 'day' || school.boarding === 'both')) score += wBoard;
      else if (user.boarding === 'homestay' && school.boarding !== 'day') score += wBoard;
      else { score += wBoard * 0.33; warnings.push('学校住宿方式不完全符合需求'); }

      // 5. EAL / 英语支持
      if (school.eal === 'yes') { score += wEal; reasons.push('学校提供 EAL 支持'); }
      else if (school.eal === 'unknown') { score += wEal * 0.5; warnings.push('EAL 情况待核实'); }
      else if (engLevel >= 3) score += wEal * 0.8;
      else { score += wEal * 0.2; warnings.push('建议提升英语后再申请无 EAL 学校'); }

      // 6. 升学率
      if (school.feeders >= 85) score += wAcademic;
      else if (school.feeders >= 75) score += wAcademic * 0.85;
      else if (school.feeders >= 65) score += wAcademic * 0.6;
      else score += wAcademic * 0.4;

      const matchPct = Math.round((score / maxScore) * 100);
      return { matchPct, reasons, warnings };
    }

    function classifyTier(matchPct) {
      if (matchPct >= 75) return 'rush';
      if (matchPct >= 55) return 'match';
      return 'safe';
    }

    function renderResults(user) {
      try {
      // 用户条件摘要
      const tags = [];
      if (user.city) {
        const cityMap = { shenzhen: '深圳', beijing: '北京', shanghai: '上海', guangzhou: '广州', hangzhou: '杭州', chengdu: '成都', nanjing: '南京', wuhan: '武汉' };
        tags.push('📍 ' + (cityMap[user.city] || user.city));
      }
      if (user.schoolPref) {
        const prefMap = { public: '🏫 公立', private: '🏢 私立', both: '🔄 都可以' };
        tags.push(prefMap[user.schoolPref] || user.schoolPref);
      }
      if (user.budget) {
        const budgetMap = { '10k': '💶 ≤€10k', '15k': '💶 €10-15k', '20k': '💶 €15-20k', '25k': '💶 €20-25k', 'unlimited': '💰 预算灵活', 'undecided': '💰 待定' };
        tags.push(budgetMap[user.budget] || user.budget);
      }
      if (user.english) {
        const engMap = { c1: '🎓 雅思6.5+', b2: '🎓 雅思6.0', b1: '🎓 雅思5.5', weak: '📚 ≤雅思5', strong: '🎓 流利', mid: '🎓 中等', weakself: '📚 较弱' };
        tags.push(engMap[user.english] || user.english);
      }
      if (Array.isArray(user.region) && user.region.length) {
        const regMap = { dublin4: 'Dublin 4', dublin6: 'Dublin 6', dublin14: 'Dundrum', blackrock: 'Blackrock', dunlaoghaire: 'Dún Laoghaire', wicklow: 'Wicklow', kildare: 'Kildare', meath: 'Meath', cork: 'Cork', galway: 'Galway', limerick: 'Limerick', waterford: 'Waterford', dublin_other: '都柏林其他' };
        tags.push('📌 地区：' + user.region.map(r => regMap[r] || r).join('、'));
      }
      if (Array.isArray(user.priorities) && user.priorities.length === 5) {
        const priMap = { academic: '升学率', happiness: '孩子快乐', integration: '融入', cost: '学费', location: '地理位置' };
        tags.push('⭐ 优先：' + priMap[user.priorities[0]] + ' > ' + priMap[user.priorities[4]]);
      }
      document.getElementById('summaryTags').innerHTML = tags.map(t => `<span class="tag">${t}</span>`).join('');

      // 地区硬筛：构建候选城市集合
      let userRegions = [];
      if (Array.isArray(user.region)) userRegions = user.region.filter(Boolean);
      else if (user.region) userRegions = [user.region];
      let pool = SCHOOLS;
      if (userRegions.length) {
        pool = SCHOOLS.filter(s => userRegions.includes(SCHOOL_DISTRICT[s.id]));
      }

      const scored = pool.map(school => {
        const { matchPct, reasons, warnings } = calculateMatch(user, school);
        return { ...school, matchPct, reasons, warnings, tier: classifyTier(matchPct) };
      }).filter(s => s.matchPct >= 30).sort((a, b) => b.matchPct - a.matchPct);

      document.getElementById('loading').style.display = 'none';

      if (scored.length === 0) {
        document.getElementById('emptyState').style.display = 'block';
        return;
      }
      document.getElementById('results').style.display = 'block';

      const rush = scored.filter(s => s.tier === 'rush').slice(0, 3);
      const match = scored.filter(s => s.tier === 'match').slice(0, 4);
      const safe = scored.filter(s => s.tier === 'safe').slice(0, 4);
      // 不足时从其他梯队补足，保证有内容
      const fill = (arr, n) => { while (arr.length < n && scored.length > arr.length) { const extra = scored.find(s => !arr.includes(s)); if (!extra) break; arr.push(extra); } };

      renderTier('rushSection', '冲刺', '条件匹配度高，值得重点申请', rush);
      renderTier('matchSection', '匹配', '当前条件较符合，推荐重点关注', match);
      renderTier('safeSection', '保底', '最稳妥的选择，建议作为保底', safe);
      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('errorState').style.display = 'block';
        document.getElementById('errorMessage').textContent = String(err && err.stack || err);
        console.error('renderResults error:', err);
      }
    }

    function renderTier(elementId, label, desc, schools) {
      const container = document.getElementById(elementId);
      if (schools.length === 0) { container.style.display = 'none'; return; }
      container.innerHTML = `
        <div class="tier-header">
          <span class="tier-badge">${label}</span>
          <span class="tier-name">${schools.length} 所学校</span>
          <span class="tier-desc">${desc}</span>
        </div>
        ${schools.map(school => renderSchoolCard(school)).join('')}
      `;
    }

    function renderSchoolCard(school) {
      const matchClass = school.matchPct >= 70 ? 'match-high' : school.matchPct >= 50 ? 'match-mid' : 'match-low';
      const genderMap = { boys: '男校', girls: '女校', mixed: '混校' };
      const boardingMap = { boarding: '全寄宿', day: '走读', both: '走读+寄宿' };
      const typeMap = { public: '公立(免费)', private: '私立', international: '国际' };
      const feeText = (school.feeDay === 0 || school.feeBoarding === 0)
        ? '✅ 完全免费（公立）'
        : (school.feeBoarding != null && school.feeDay != null)
          ? `💰 走读€${school.feeDay.toLocaleString()}/年 | 寄宿€${school.feeBoarding.toLocaleString()}/年`
          : school.feeBoarding != null
            ? `💰 寄宿€${school.feeBoarding.toLocaleString()}/年`
            : school.feeDay != null
              ? `💰 走读€${school.feeDay.toLocaleString()}/年`
              : '💰 学费请咨询学校';

      return `
        <div class="school-card" onclick="toggleDetails(this)">
          <div class="school-header">
            <div>
              <div class="school-name">${school.name}</div>
              <div class="school-type">${typeMap[school.type]} | ${genderMap[school.gender]} | ${boardingMap[school.boarding]}</div>
            </div>
            <div class="match-score ${matchClass}">${school.matchPct}% 匹配</div>
          </div>
          <div class="school-tags">
            <span class="school-tag">📍 ${school.city}, ${school.county}</span>
            ${school.eal === 'yes' ? '<span class="school-tag" style="background:#d4edda;color:#155724;">🆔 EAL支持</span>' : school.eal === 'no' ? '<span class="school-tag" style="background:#f8d7da;color:#721c24;">⚠️ 无EAL</span>' : '<span class="school-tag" style="background:#fff3cd;color:#856404;">❓ EAL待核</span>'}
            <span class="school-tag">${feeText}</span>
            <span class="school-tag">📊 LC升学率 ${school.lcFeeder}%</span>
          </div>
          <div class="school-meta">
            <div class="meta-item">
              <span class="meta-label">申请状态</span>
              <span class="meta-value">${school.type === 'public' ? '🏫 公立：联系学区/教育局' : '📅 联系招生办确认'}</span>
            </div>
            ${school.website ? `
            <div class="meta-item">
              <span class="meta-label">官网</span>
              <a href="${school.website}" target="_blank" class="meta-value" style="color: #1a5f7a;">访问官网 →</a>
            </div>` : ''}
          </div>
          <div class="action-box">
            <div class="action-title">📋 申请行动清单</div>
            <ul class="action-list">
              <li>准备申请材料（成绩单 / 推荐信）</li>
              <li>联系学校招生办确认学位</li>
              ${school.website ? `<a href="${school.website}" target="_blank" class="action-link">官网申请 →</a>` : ''}
            </ul>
          </div>
          <div class="school-details">
            ${school.reasons.length > 0 ? `<p><strong>✅ 推荐理由：</strong>${school.reasons.join('、')}</p>` : ''}
            ${school.warnings.length > 0 ? `<p><strong>⚠️ 注意事项：</strong>${school.warnings.join('、')}</p>` : ''}
          </div>
          <button class="expand-btn" type="button">查看详情 ▼</button>
        </div>
      `;
    }

    function toggleDetails(card) {
      const details = card.querySelector('.school-details');
      const btn = card.querySelector('.expand-btn');
      details.classList.toggle('show');
      btn.textContent = details.classList.contains('show') ? '收起 ▲' : '查看详情 ▼';
    }

    document.addEventListener('DOMContentLoaded', function() {
      const userData = loadUserData();
      if (!userData) {
        document.getElementById('loading').innerHTML = `
          <div style="padding:40px;text-align:center;">
            <h3>暂无问卷数据</h3>
            <p style="margin:15px 0;color:#999;">请先填写择校问卷</p>
            <a href="questionnaire.html" class="btn-primary">去填问卷</a>
          </div>`;
        return;
      }
      // 字段归一化：region 强制数组、boarding 默认 flex、缺字段补默认
      if (!Array.isArray(userData.region)) {
        userData.region = userData.region ? [userData.region] : [];
      }
      if (!userData.boarding) userData.boarding = 'flex';
      if (!userData.budget) userData.budget = 'undecided';
      if (!userData.schoolType) userData.schoolType = userData.schoolPref || 'both';

      // 安家横幅：如果问卷包含居住区域数据，显示 housing.html 入口
      if (userData.lifestyle || userData.housingIntent || userData.resideRegion) {
        const banner = document.getElementById('housingBanner');
        const sub = document.getElementById('housingBannerSub');
        const lifestyleMap = {employed:'有工作', entrepreneur:'做生意', seeking:'打算找工作', remote:'远程工作', passive:'被动收入', retiree:'陪伴孩子为主'};
        const intentMap = {buy:'计划买房', rent:'计划租房', both:'考虑买房+租房', undecided:'待定'};
        if (banner && sub) {
          banner.style.display = 'block';
          const ls = lifestyleMap[userData.lifestyle] || '待定';
          const hi = intentMap[userData.housingIntent] || '';
          const regions = Array.isArray(userData.resideRegion) ? userData.resideRegion.join('、') : (userData.resideRegion || '');
          sub.textContent = '生活方式：' + ls + (hi ? ' | 居住意向：' + hi : '') + (regions ? ' | 区域：' + regions : '');
        }
      }

      // 调试输出：把 userData 原始值打到页面底部（仅 debug 期保留）
      const dbg = document.createElement('pre');
      dbg.id = 'debugDump';
      dbg.style.cssText = 'position:fixed;bottom:0;left:0;right:0;max-height:200px;overflow:auto;background:#111;color:#0f0;font-size:11px;padding:8px;margin:0;z-index:9999;border-top:2px solid #0f0;white-space:pre-wrap;';
      dbg.textContent = '🔍 DEBUG userData:\n' + JSON.stringify(userData, null, 2);
      document.body.appendChild(dbg);

      try { renderResults(userData); }
      catch (err) {
        document.getElementById('loading').style.display = 'none';
        const errBox = document.getElementById('errorState');
        if (errBox) {
          errBox.style.display = 'block';
          document.getElementById('errorMessage').textContent = String(err && err.stack || err);
        }
        console.error('renderResults crash:', err);
      }
    });
  </script>
</body>
